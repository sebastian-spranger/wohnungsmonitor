allow = ["Bash=cd /tmp && rm -rf wm_test && mkdir wm_test && cd wm_test && APP_DB=/tmp/wm_test/app.db PYTHONPATH=/Users/sebastianspranger/Library/CloudStorage/OneDrive-Personal/Projects/wohnungsmonitor .venv_py 2>/dev/null; APP_DB=/tmp/wm_test/app.db /Users/sebastianspranger/Library/CloudStorage/OneDrive-Personal/Projects/wohnungsmonitor/.venv/bin/python - <<'EOF'\nimport os, sys\nsys.path.insert(0, \"/Users/sebastianspranger/Library/CloudStorage/OneDrive-Personal/Projects/wohnungsmonitor\")\nimport profiles\nprofiles.init_db()\n# upsert neu + merge\nprofiles.upsert_user(\"user_1\", email=\"a@b.de\", name=\"Anna\", config={\"filters\": {\"max_warm_miete\": 1600}})\nprofiles.upsert_user(\"user_1\", config={\"filters\": {\"min_groesse\": 55}})  # merge\np = profiles.get_user(\"user_1\")\nassert p.uid == \"user_1\" and p.active and p.email == \"a@b.de\"\nassert p.filters == {\"max_warm_miete\": 1600, \"min_groesse\": 55}, p.filters\nassert p.chat_ids == []\n# chat linken\nprofiles.link_chat(\"123\", \"user_1\")\nprofiles.link_chat(\"456\", \"user_1\")\np = profiles.get_user(\"user_1\")\nassert sorted(p.chat_ids) == [\"123\", \"456\"], p.chat_ids\nassert profiles.chat_uid(\"123\") == \"user_1\"\nassert profiles.profile_for_chat(\"123\").uid == \"user_1\"\n# active flag + load_active_profiles\nprofiles.upsert_user(\"user_2\", email=\"b@b.de\", config={})\nprofiles.set_active(\"user_2\", False)\nact = profiles.load_active_profiles()\nassert [x.uid for x in act] == [\"user_1\"], [x.uid for x in act]\n# delete\nprofiles.delete_user(\"user_1\")\nassert profiles.get_user(\"user_1\") is None\nassert profiles.chat_uid(\"123\") is None\nprint(\"CRUD OK:\", profiles.list_users())\nEOF"]
