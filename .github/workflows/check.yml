name: Wohnungsmonitor

on:
  schedule:
    - cron: '*/5 * * * *'   # alle 5 Minuten, 24/7
  workflow_dispatch:          # auch manuell startbar über GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9        # kill-switch (Browser-Portale brauchen länger)
    permissions:
      contents: write

    steps:
      - name: Checkout (inkl. seen.json)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: pip install httpx[http2] beautifulsoup4 h2 playwright

      - name: Chromium + xvfb installieren
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Monitor ausführen
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_WARM_MIETE:   "2200"
          MAX_KALT_MIETE:   "1950"
          MIN_GROESSE:      "45"
          MAX_RADIUS_KM:    "4.0"
          VERFUEGBAR_BIS:   "2026-07-15"
        # xvfb-run: virtueller Bildschirm → Chromium läuft headful (IS24 umgeht so die Bot-Sperre)
        run: xvfb-run -a python monitor_lite.py

      - name: seen.json speichern
        run: |
          git config user.name  "Wohnungsmonitor[bot]"
          git config user.email "bot@noreply.github.com"
          git add seen.json matches.json fahrtzeit_cache.json geocode_cache.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Änderungen zu speichern."
            exit 0
          fi
          git commit -m "chore: update seen [skip ci]"
          # Remote kann inzwischen weitergewandert sein → rebase + retry
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push fehlgeschlagen (Versuch $i), neuer Versuch..."
            sleep 5
          done
          echo "Push endgültig fehlgeschlagen" >&2
          exit 1
