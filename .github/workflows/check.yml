name: Wohnungsmonitor

on:
  # HAUPTBETRIEB läuft jetzt als systemd-Service auf der Oracle-VM
  # (monitor_lite.py --serve, alle 90s) — siehe deploy/oracle-setup.sh.
  # Dieser Workflow ist NUR noch der manuelle Fallback: kein Cron, damit
  # GitHub-Actions-Läufe die VM-Engine nicht doppelt schedelen und sich
  # Push-Races auf seen.json nicht mehr häufen.
  workflow_dispatch:          # manuell startbar über GitHub UI

concurrency:
  group: wohnungsmonitor

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9        # kill-switch (Browser-Portale brauchen länger)
    permissions:
      contents: write

    steps:
      - name: Checkout (inkl. seen.json)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: pip install httpx[http2] beautifulsoup4 h2 playwright

      - name: Chromium + xvfb installieren
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Monitor ausführen
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAX_WARM_MIETE:   "2200"
          MAX_KALT_MIETE:   "1950"
          MIN_GROESSE:      "45"
          MAX_RADIUS_KM:    "4.0"
          VERFUEGBAR_BIS:   "2027-12-31"
        # xvfb-run: virtueller Bildschirm → Chromium läuft headful (IS24 umgeht so die Bot-Sperre)
        run: xvfb-run -a python monitor_lite.py

      - name: seen.json speichern
        run: |
          git config user.name  "Wohnungsmonitor[bot]"
          git config user.email "bot@noreply.github.com"
          # Einzeln adden: git add bricht sonst komplett ab, sobald eine der
          # Dateien fehlt (z.B. user_filters.json vor dem ersten eigenen Filter).
          for f in seen.json matches.json fahrtzeit_cache.json geocode_cache.json user_filters.json telegram_offset.json; do
            git add "$f" 2>/dev/null || true
          done
          if git diff --staged --quiet; then
            echo "Keine Änderungen zu speichern."
            exit 0
          fi
          git commit -m "chore: update seen [skip ci]"
          # Race-sicherer Push: Die State-Dateien sind Caches, die lokal bereits den
          # frisch geladenen Remote-Stand enthalten (beim Checkout) → bei Konflikt
          # gewinnt die lokale (neuere) Version via Merge-Strategie 'ours'.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main 2>&1 && git push 2>&1; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $i) – Rebase aufraeumen, Merge mit 'ours' versuchen..."
            git rebase --abort 2>/dev/null || true
            if git pull --no-rebase -X ours origin main 2>&1 && git push 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Push endgültig fehlgeschlagen" >&2
          exit 1